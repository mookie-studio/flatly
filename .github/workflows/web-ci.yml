name: Web CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Format
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: API types match the contract
        run: npm run api:check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Vulnerabilities (production dependencies)
        run: npm audit --omit=dev --audit-level=high
