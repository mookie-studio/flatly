name: Bug report
description: Report something that is not working as expected
labels: ["bug"]
body:
  - type: dropdown
    id: mvp
    attributes:
      label: MVP scope
      description: Which MVP does this issue belong to?
      options:
        - mvp1
        - mvp2
        - post-mvp
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, screenshots, browser or environment.
