name: Chore
description: Maintenance, tooling, refactoring or infrastructure work
labels: ["chore"]
body:
  - type: dropdown
    id: mvp
    attributes:
      label: MVP scope
      description: Which MVP does this chore belong to?
      options:
        - mvp1
        - mvp2
        - post-mvp
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done and why.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      placeholder: |
        - ...
    validations:
      required: true
